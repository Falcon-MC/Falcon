name: Feature request
description: Suggest a missing vanilla feature or an improvement to Falcon
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/orgs/Falcon-MC/projects/1) first: the feature may already be planned.

  - type: dropdown
    attributes:
      label: Type of request
      options:
        - Missing vanilla feature
        - Server administration
        - Scripting API
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: Is your request related to a problem?
      description: A clear and concise description of the problem. Ex. "Server owners cannot ..."
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the solution you'd like
      description: What you want to happen. For vanilla features, describe how the game behaves.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe alternatives you've considered
      description: Other ways to solve the problem, including ways that need no change to Falcon.

  - type: textarea
    attributes:
      label: Additional context
      description: Screenshots, links to the Minecraft wiki, or anything else that helps.
