name: Bug report
description: Something in Falcon does not work, or behaves differently from vanilla Bedrock
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > [!CAUTION]
        > If a player or a modified client can trigger this over the network (crash, duplication, authentication bypass),
        > **do not report it here**. Read the [Security Policy](https://github.com/Falcon-MC/Falcon/blob/main/SECURITY.md) instead.

        Please [search existing issues](https://github.com/Falcon-MC/Falcon/issues) first.

  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Exact steps, starting from a fresh world if possible.
      placeholder: |
        1. Place a copper block
        2. Right-click it with a honeycomb
        3. ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
      description: What should happen. For gameplay bugs, describe what vanilla Bedrock does in the same situation.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual behavior
      description: What happens instead.
    validations:
      required: true

  - type: input
    attributes:
      label: Falcon version
      description: The version and commit printed by the `/about` command.
      placeholder: "1.0.0 (a1b2c3d)"
    validations:
      required: true

  - type: input
    attributes:
      label: Bedrock client version
      placeholder: "1.26.51"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: textarea
    attributes:
      label: Behavior packs and resource packs
      description: List the packs loaded on the server, or write "None".
    validations:
      required: true

  - type: textarea
    attributes:
      label: Server log
      description: The relevant part of the server console output. It is formatted as code automatically.
      render: text

  - type: textarea
    attributes:
      label: Screenshots or videos
      description: If applicable, add screenshots or a short video to show the problem.

  - type: textarea
    attributes:
      label: Additional context
      description: Anything else that might help.
