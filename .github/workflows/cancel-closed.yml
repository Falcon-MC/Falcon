name: Cancel runs of closed pull requests

# a pull request that is merged or closed leaves its runs in the queue: nothing reads their result any more
on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-22.04
    steps:
      - name: Cancel the runs still waiting or running for the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # a branch name alone matches every fork's branch of that name: the head repository tells them apart
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$BRANCH" -f event=pull_request -F per_page=100 \
            --jq '.workflow_runs[] | select(.status != "completed" and .head_repository.full_name == env.HEAD_REPO) | .id' |
            while read -r id; do
              gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true
            done
