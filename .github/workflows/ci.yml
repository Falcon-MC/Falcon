name: CI

# not on pull requests: they are merged without waiting for it, so a run per pull request only filled
# the queue ahead of dev's. A branch can still be built by hand with workflow_dispatch
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
  repository_dispatch:
    types:
      - upstream-updated

# the run in progress is left to finish and only the newest waiting one is kept: with cancelling, a burst
# of merges meant no run of dev ever reached its end
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# pull requests target dev, and a run can only restore caches from its own branch,
# its base branch and the default branch. without a warm cache on dev every pull
# request recompiles the dependencies from scratch, so dev is built on push to seed it.
# content keeps hits across runner images whose compiler mtime differs.
env:
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: "2G"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-2022
          - name: macos-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Report the upstream change
        if: github.event_name == 'repository_dispatch'
        run: echo "Rebuilding after ${{ github.event.client_payload.repository }}@${{ github.event.client_payload.sha }}"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache zlib1g-dev libssl-dev

      - name: Install macOS dependencies
        if: matrix.os == 'macos-15'
        run: brew install ninja ccache openssl@3

      - name: Install MSYS2 toolchain
        if: matrix.os == 'windows-2022'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-openssl
            git

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ci-ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ci-ccache-${{ matrix.name }}-

      - name: Configure and build (Linux)
        if: matrix.os == 'ubuntu-22.04'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel
          ccache --show-stats

      - name: Configure and build (macOS)
        if: matrix.os == 'macos-15'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build --parallel
          ccache --show-stats

      - name: Configure and build (Windows)
        if: matrix.os == 'windows-2022'
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel 4
          ccache --show-stats

  tests:
    name: Tests linux-x64
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache zlib1g-dev libssl-dev

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ci-ccache-tests-${{ github.sha }}
          restore-keys: |
            ci-ccache-tests-
            ci-ccache-linux-x64-

      # the embedded checks are off by default: without this job no test ever runs in ci
      - name: Build and run the embedded tests
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFALCON_BUILD_EMBEDDED_TESTS=ON
          cmake --build build --parallel
          ctest --test-dir build/Falcon.Server --output-on-failure --parallel 2

  internal-plugins:
    name: Internal plugins linux-x64
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache zlib1g-dev libssl-dev

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ci-ccache-internal-plugins-${{ github.sha }}
          restore-keys: |
            ci-ccache-internal-plugins-
            ci-ccache-linux-x64-

      - name: Build the server and the internal example plugins
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFALCON_BUILD_INTERNAL_PLUGINS=ON
          cmake --build build --parallel

      - name: Build the example plugin against the packaged SDK
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euo pipefail
          cmake -DFALCON_BUILD_DIR=build -DFALCON_SOURCE_DIR=. -DFALCON_SDK_OUTPUT=sdk -DFALCON_SDK_PLATFORM=linux \
            -DFALCON_SDK_VERSION=ci -P Falcon.Server/cmake/FalconPackageSDK.cmake
          du -sh sdk
          cmake -S build/_deps/falcon_plugin_api-src -B sdk-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFALCON_PLUGIN_API_BUILD_EXAMPLES=OFF \
            -DFALCON_PLUGIN_API_BUILD_INTERNAL_EXAMPLES=ON \
            -DFALCON_SDK_DIR="$PWD/sdk"
          cmake --build sdk-build --parallel

      - name: Load the example plugin in the server
        run: |
          set -euo pipefail
          mkdir -p run/plugins/GardenPlugin
          cp sdk-build/examples/internal/GardenPlugin/libGardenPlugin.so run/plugins/GardenPlugin/
          cp build/_deps/falcon_plugin_api-src/examples/internal/GardenPlugin/plugin.json run/plugins/GardenPlugin/
          cd run
          timeout --signal=INT --kill-after=30 120 ../build/Falcon.Server/FalconServer --no-wizard < /dev/null \
            | tee console.log || true
          grep -q "Loaded internal plugin GardenPlugin" console.log server.log
          grep -q "Enabled plugin GardenPlugin" console.log server.log

  dotnet-plugins:
    name: .NET plugins linux-x64
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache zlib1g-dev libssl-dev

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ci-ccache-dotnet-plugins-${{ github.sha }}
          restore-keys: |
            ci-ccache-dotnet-plugins-
            ci-ccache-linux-x64-

      - name: Build the server
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel

      - name: Build the example C# plugin
        run: |
          set -euo pipefail
          api=build/_deps/falcon_plugin_api-src
          dotnet publish "$api/dotnet/Falcon.PluginAPI/Falcon.PluginAPI.csproj" -c Release -o run/plugins/.dotnet
          dotnet publish "$api/examples/dotnet/HelloPlugin/HelloPlugin.csproj" -c Release -o run/plugins/HelloPlugin
          cp "$api/examples/dotnet/HelloPlugin/plugin.json" run/plugins/HelloPlugin/
          ls run/plugins/.dotnet run/plugins/HelloPlugin

      - name: Load the example C# plugin in the server
        run: |
          set -euo pipefail
          cd run
          timeout --signal=INT --kill-after=30 120 ../build/Falcon.Server/FalconServer --no-wizard < /dev/null \
            | tee console.log || true
          grep -q "Loaded .NET plugin HelloPlugin" console.log server.log
          grep -q "Enabled plugin HelloPlugin" console.log server.log

  java-plugins:
    name: Java plugins linux-x64
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache zlib1g-dev libssl-dev

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ci-ccache-java-plugins-${{ github.sha }}
          restore-keys: |
            ci-ccache-java-plugins-
            ci-ccache-linux-x64-

      - name: Build the server
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel

      - name: Build the example Java plugin
        run: |
          set -euo pipefail
          api=build/_deps/falcon_plugin_api-src
          mvn -B -f "$api/java/pom.xml" install
          mvn -B -f "$api/examples/java/HelloPlugin/pom.xml" package
          mkdir -p run/plugins/.java run/plugins/HelloPlugin
          cp "$api"/java/target/falcon-plugin-api-*.jar run/plugins/.java/
          cp "$api/examples/java/HelloPlugin/target/HelloPlugin.jar" run/plugins/HelloPlugin/
          cp "$api/examples/java/HelloPlugin/plugin.json" run/plugins/HelloPlugin/
          ls run/plugins/.java run/plugins/HelloPlugin

      - name: Load the example Java plugin in the server
        run: |
          set -euo pipefail
          cd run
          timeout --signal=INT --kill-after=30 120 ../build/Falcon.Server/FalconServer --no-wizard < /dev/null \
            | tee console.log || true
          grep -q "Loaded Java plugin HelloPlugin" console.log server.log
          grep -q "Enabled plugin HelloPlugin" console.log server.log
