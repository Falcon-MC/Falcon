name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.26.50.01)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a prerelease"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create the release as a draft"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve version and changelog
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      draft: ${{ steps.resolve.outputs.draft }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: resolve
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            PRERELEASE=false
            DRAFT=false
          else
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
            PRERELEASE="${{ inputs.prerelease }}"
            DRAFT="${{ inputs.draft }}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
            echo "Version must look like X.Y.Z or X.Y.Z.W, got '$VERSION'" >&2
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
            echo "draft=$DRAFT"
          } >> "$GITHUB_OUTPUT"

      - name: Build changelog
        id: changelog
        env:
          COMMIT_BASE: ${{ github.server_url }}/${{ github.repository }}/commit
        run: |
          set -euo pipefail

          PREVIOUS="$(git tag --list 'v*' --sort=-creatordate | grep -v "^${{ steps.resolve.outputs.tag }}$" | head -n 1 || true)"

          if [ -n "$PREVIOUS" ]; then
            RANGE="${PREVIOUS}..HEAD"
            echo "Changelog range: $RANGE"
          else
            RANGE="HEAD"
            echo "No previous tag found, listing the full history"
          fi

          {
            echo "changelog<<CHANGELOG_EOF"

            if [ -n "$PREVIOUS" ]; then
              echo "### Changes since [\`$PREVIOUS\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/$PREVIOUS)"
            else
              echo "### Changes"
            fi

            echo ""
            git log --no-merges --reverse --pretty=format:"- [\`%h\`](${COMMIT_BASE}/%H) %s" "$RANGE"
            echo ""
            echo ""

            if [ -n "$PREVIOUS" ]; then
              echo "**Full diff:** [\`${PREVIOUS}...${{ steps.resolve.outputs.tag }}\`](${{ github.server_url }}/${{ github.repository }}/compare/${PREVIOUS}...${{ steps.resolve.outputs.tag }})"
            fi

            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            artifact: FalconServer-linux-x64
            binary: FalconServer
          - name: windows-x64
            os: windows-2022
            artifact: FalconServer-windows-x64.exe
            binary: FalconServer.exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache zlib1g-dev libssl-dev

      - name: Install MSYS2 toolchain
        if: matrix.os == 'windows-2022'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-openssl
            git

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Configure and build (Linux)
        if: matrix.os == 'ubuntu-22.04'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFALCON_BUILD_VERSION=${{ needs.prepare.outputs.version }}
          cmake --build build --parallel
          ccache --show-stats

      - name: Configure and build (Windows)
        if: matrix.os == 'windows-2022'
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFALCON_BUILD_VERSION=${{ needs.prepare.outputs.version }}
          cmake --build build --parallel
          ccache --show-stats

      - name: Stage the executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "build/Falcon.Server/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          cd dist
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List the release assets
        run: ls -lh artifacts

      - name: Create the release
        uses: ncipollo/release-action@v1.15.0
        with:
          artifacts: "artifacts/*"
          tag: ${{ needs.prepare.outputs.tag }}
          commit: ${{ github.sha }}
          name: Falcon ${{ needs.prepare.outputs.version }}
          draft: ${{ needs.prepare.outputs.draft }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            **Falcon ${{ needs.prepare.outputs.version }} for Minecraft: Bedrock Edition 1.26.50 (protocol 2193)**

            | Platform | Download |
            | --- | --- |
            | Linux x64 | `FalconServer-linux-x64` |
            | Windows x64 | `FalconServer-windows-x64.exe` |

            Each binary ships with a `.sha256` checksum file.

            ${{ needs.prepare.outputs.changelog }}
